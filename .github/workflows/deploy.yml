name: Deploy Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai clasp
        run: npm install -g @google/clasp

      - name: Nap thong tin dang nhap
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Tao .clasp.json
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"src\"}" > .clasp.json

      - name: Day code len Apps Script
        run: clasp push --force

      - name: Cap nhat ban deploy web app
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Chua co DEPLOYMENT_ID - chi push code, khong tao version moi."
            exit 0
          fi
          clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7}"
